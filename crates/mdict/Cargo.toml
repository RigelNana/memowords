[package]
name = "mdict"
description = "High-performance MDX/MDD dictionary parser and indexer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
adler = "1"
encoding_rs = "0.8"
quick-xml = "0.37"
memmap2 = "0.9"
flate2 = "1"
ripemd = "0.1"
minilzo-rs = "0.6"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "parse"
harness = false
